<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Nền/vỏ trái bơ -->
  <path d="M 50 15
           C 75 15, 85 45, 85 65
           C 85 85, 65 95, 50 95
           C 35 95, 15 85, 15 65
           C 15 45, 25 15, 50 15 Z"
        fill="#3F5927" stroke="#2D401C" stroke-width="2"/>

  <!-- Thịt bơ -->
  <path d="M 50 20
           C 70 20, 78 47, 78 65
           C 78 82, 63 90, 50 90
           C 37 90, 22 82, 22 65
           C 22 47, 30 20, 50 20 Z"
        fill="#D6E685"/>

  <!-- Thịt bơ phần màu nhạt hơn ở giữa để tạo khối -->
  <path d="M 50 28
           C 62 28, 68 50, 68 65
           C 68 76, 58 82, 50 82
           C 42 82, 32 76, 32 65
           C 32 50, 38 28, 50 28 Z"
        fill="#E8F2A1" opacity="0.6"/>

  <!-- Hạt bơ -->
  <circle cx="50" cy="65" r="16" fill="#8C5C38"/>

  <!-- Phản quang trên hạt bơ (highlight) -->
  <circle cx="45" cy="60" r="4" fill="#B3815D" opacity="0.8"/>
  <circle cx="54" cy="67" r="1.5" fill="#B3815D" opacity="0.5"/>
</svg>
